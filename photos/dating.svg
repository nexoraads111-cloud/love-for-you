<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#2b2b2d"/>
      <stop offset="100%" stop-color="#1f1f21"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="200" fill="#bfbfbf"/>
  <g transform="translate(40,20)">
    <rect width="1020" height="160" rx="36" fill="url(#bg)" filter="url(#shadow)"/>
    <text x="36" y="70" font-family="Arial, Helvetica, sans-serif" font-size="56" fill="#ffffff">я согласна</text>

    <!-- time -->
    <text x="920" y="110" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#a9a9a9">10:31 PM</text>

    <!-- blue pill with heart -->
    <g transform="translate(36,98)">
      <rect x="0" y="0" width="170" height="46" rx="23" fill="#4a88f4"/>
      <!-- heart -->
      <path d="M28 30 C22 24, 16 20, 18 14 C20 8, 28 8, 32 14 C36 8, 44 8, 46 14 C48 20, 42 24, 36 30 C32 33, 28 35, 28 30 Z" fill="#ff4b4b" stroke="#e63e3e" stroke-width="2"/>
      <!-- profile circle -->
      <circle cx="124" cy="23" r="18" fill="#d6d6d6" stroke="#2b2b2b" stroke-width="2"/>
    </g>
  </g>
</svg>
